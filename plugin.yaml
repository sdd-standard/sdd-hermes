name: sdd-workflow
version: "2.1.0"
description: "Spec-Driven Development (SDD Puro v2.1) para Hermes Agent. Operacionaliza Constitution, GEARS, Delta Specs, Quality Gate 100% Passivo em 3 Camadas (com Say-Do Gate), Entrevista Escopada e Paginação Elástica de Memória."
author: "Maurissi <devmaurissi@gmail.com>"
license: "MIT"
repository: "https://github.com/sdd-standard/sdd-hermes"
requires_hermes: ">=0.21.0"

provides_tools:
  - sdd_check_ids
  - sdd_say_do_audit

provides_hooks:
  - on_session_start
  - pre_llm_call
  - pre_tool_call
  - post_tool_call

provides_commands:
  - sdd-init
  - sdd-adopt
  - sdd-specify
  - sdd-design
  - sdd-tasks
  - sdd-implement
  - sdd-change
  - sdd-validate
